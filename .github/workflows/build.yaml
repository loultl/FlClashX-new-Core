name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: android,windows,linux). Empty = all"
        required: false
        default: ""
        type: string
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve build matrix
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail

          # macOS is intentionally absent: signing + notarization require Apple
          # Developer secrets (APPLE_CERTIFICATE, APPLE_API_KEY_*) that are not
          # configured for this fork. Re-add the macos entries here once set.
          # Format: platform|os|arch   (arch may be empty)
          entries=(
            'android|ubuntu-latest|'
            'windows|windows-latest|amd64'
            'linux|ubuntu-24.04|amd64'
            'windows|windows-11-arm|arm64'
            'linux|ubuntu-24.04-arm|arm64'
          )

          req=()
          if [ -n "${REQUESTED//[[:space:]]/}" ]; then
            IFS=',' read -ra parts <<< "$REQUESTED"
            for p in "${parts[@]}"; do
              p="${p//[[:space:]]/}"
              if [ -n "$p" ]; then req+=("$p"); fi
            done
          fi

          out='['
          count=0
          for e in "${entries[@]}"; do
            IFS='|' read -r platform os arch <<< "$e"

            if [ ${#req[@]} -gt 0 ]; then
              match=0
              for r in "${req[@]}"; do
                if [ "$r" = "$platform" ]; then match=1; break; fi
              done
              if [ "$match" -ne 1 ]; then continue; fi
            fi

            if [ "$count" -gt 0 ]; then out="$out,"; fi
            item="{\"platform\":\"$platform\",\"os\":\"$os\""
            if [ -n "$arch" ]; then item="$item,\"arch\":\"$arch\""; fi
            out="$out$item}"
            count=$((count + 1))
            echo "  - $platform${arch:+ $arch} on $os"
          done
          out="$out]"

          if [ "$count" -eq 0 ]; then
            echo "::error::No known platform matched '$REQUESTED'. Known: android,windows,linux"
            exit 1
          fi

          if [ ${#req[@]} -eq 0 ]; then
            echo "Requested platforms: (none) -> building all"
          else
            echo "Requested platforms: $REQUESTED"
          fi
          echo "matrix=$out" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath
      
      - name: Setup Rust ARM64 target for cross-compilation
        if: matrix.platform == 'windows' && matrix.arch == 'arm64' && !startsWith(matrix.os, 'windows-11-arm')
        run: rustup target add aarch64-pc-windows-msvc

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(KEYSTORE)
          [ -n "$KEY_ALIAS" ] || missing+=(KEY_ALIAS)
          [ -n "$STORE_PASSWORD" ] || missing+=(STORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Android signing secrets missing or empty: ${missing[*]}. Set them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks

          # Fail here instead of ~7min later inside Gradle with an opaque
          # "Tag number over 30 is not supported" from the ASN.1 parser.
          if ! keytool -list -keystore android/app/keystore.jks \
                -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::android/app/keystore.jks is not a valid keystore for alias '$KEY_ALIAS'. KEYSTORE must be base64 of the binary keystore (base64 -w0 keystore.jks)."
            exit 1
          fi

          echo "keyAlias=$KEY_ALIAS" >> android/local.properties
          echo "storePassword=$STORE_PASSWORD" >> android/local.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/local.properties
          echo "✅ Android keystore validated for alias '$KEY_ALIAS'"

      - name: Setup Firebase Config
        if: startsWith(matrix.platform,'android')
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    runs-on: ubuntu-latest
    needs: [build]
    # Only tag runs may rewrite CHANGELOG.md and push back to main.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        if: ${{ env.IS_STABLE == 'true' }}
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          tags=($(git tag --merged $(git rev-parse HEAD) --sort=-creatordate))
          preTag=$(grep -oP '^## \K.*' CHANGELOG.md | head -n 1)
          currentTag=""
          for ((i = 0; i <= ${#tags[@]}; i++)); do
            if (( i < ${#tags[@]} )); then
              tag=${tags[$i]}
            else
              tag=""
            fi
            if [ -n "$currentTag" ]; then
              if [ "$(echo -e "$currentTag\n$preTag" | sort -V | head -n 1)" == "$currentTag" ]; then
                break
              fi
            fi
            if [ -n "$currentTag" ]; then
              echo "## $currentTag" >> NEW_CHANGELOG.md
              echo "" >> NEW_CHANGELOG.md
              if [ -n "$tag" ]; then
                git log --pretty=format:"%B" "$tag..$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              else
                git log --pretty=format:"%B" "$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              fi
              echo "" >> NEW_CHANGELOG.md
            fi
            currentTag=$tag
          done
          cat CHANGELOG.md >> NEW_CHANGELOG.md
          cat NEW_CHANGELOG.md > CHANGELOG.md

      - name: Commit
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "flclashx@pluralplay.ru"
            git config --local user.name "pluralplay"
            git commit -m "Update changelog"
            git push
            if [ $? -eq 0 ]; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions: write-all
    needs: [build]
    if: always() && (needs.build.result == 'success') && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          tags=($(git tag --merged $(git rev-parse HEAD) --sort=-creatordate))
          
          # Determine previous tag based on release type
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            # For stable: get latest stable release from API
            preTag=$(curl --silent "https://api.github.com/repos/pluralplay/FlClashX/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")' || echo "")
          else
            # For pre-release: get the latest pre-release tag (last tag with '-' in name before current)
            preTag=""
            for tag in "${tags[@]}"; do
              if [ "$tag" != "${tags[0]}" ] && [[ "$tag" == *-* ]]; then
                preTag="$tag"
                break
              fi
            done
            # If no previous pre-release found, use latest stable
            if [ -z "$preTag" ]; then
              preTag=$(curl --silent "https://api.github.com/repos/pluralplay/FlClashX/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")' || echo "")
            fi
          fi
          
          currentTag=""
          for ((i = 0; i <= ${#tags[@]}; i++)); do
            if (( i < ${#tags[@]} )); then
              tag=${tags[$i]}
            else
              tag=""
            fi
            if [ -n "$currentTag" ]; then
              if [ "$(echo -e "$currentTag\n$preTag" | sort -V | head -n 1)" == "$currentTag" ]; then
                break
              fi
            fi
            if [ -n "$currentTag" ]; then
              if [ -n "$tag" ]; then
                git log --pretty=format:"%B" "$tag..$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> release.md
              else
                git log --pretty=format:"%B" "$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> release.md
              fi
              echo "" >> release.md
            fi
            currentTag=$tag
          done

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          else
            sed "s|VERSION|$version|g" ./.github/pre_release_template.md >> release.md
          fi

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true

      - name: Upload release notes for notification
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release.md
          retention-days: 1

  aur-publish:
    needs: [upload]
    if: always() && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSHEOF

      - name: Parse release tag
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^([0-9.]+)-pre\.([0-9]+)$ ]]; then
            echo "pkgver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "pkgrel=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "aur_pkg=flclashx-git" >> "$GITHUB_OUTPUT"
          else
            echo "pkgver=$VERSION" >> "$GITHUB_OUTPUT"
            echo "pkgrel=1" >> "$GITHUB_OUTPUT"
            echo "aur_pkg=flclashx-bin" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone AUR repository
        run: git clone ssh://aur@aur.archlinux.org/${{ steps.release.outputs.aur_pkg }}.git /tmp/aur-pkg

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aur-assets

          gh release download "$GITHUB_REF_NAME" \
            -p "FlClashX-linux-amd64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY"
          echo "sha_x86=$(sha256sum /tmp/aur-assets/FlClashX-linux-amd64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          if gh release download "$GITHUB_REF_NAME" \
            -p "FlClashX-linux-arm64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "sha_arm=$(sha256sum /tmp/aur-assets/FlClashX-linux-arm64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "has_arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_arm=false" >> "$GITHUB_OUTPUT"
          fi

          rm -rf /tmp/aur-assets

      - name: Update PKGBUILD
        working-directory: /tmp/aur-pkg
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
          PKGREL: ${{ steps.release.outputs.pkgrel }}
          SHA_X86: ${{ steps.checksums.outputs.sha_x86 }}
          SHA_ARM: ${{ steps.checksums.outputs.sha_arm }}
          HAS_ARM: ${{ steps.checksums.outputs.has_arm }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86}')/" PKGBUILD

          if [ "$HAS_ARM" == "true" ]; then
            sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM}')/" PKGBUILD
          else
            sed -i "/^[[:space:]]*'aarch64'/d" PKGBUILD
            sed -i "/^source_aarch64=/d" PKGBUILD
            sed -i "/^sha256sums_aarch64=/d" PKGBUILD
          fi

      - name: Generate .SRCINFO
        working-directory: /tmp/aur-pkg
        run: |
          docker run --rm -v "$(pwd):/pkg" archlinux:base-devel bash -c \
            "useradd -m -u $(id -u) builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        working-directory: /tmp/aur-pkg
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Github Actions (pluralplay)"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to $GITHUB_REF_NAME"
            git push
          fi

  notify:
    needs: [upload, aur-publish]
    # Runs after AUR publish; posts as long as the GitHub release succeeded,
    # regardless of the AUR result.
    if: always() && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes

      - name: Prepare commit list for notification
        id: prepare_commits
        run: |
          main_commit=$(git log -1 --pretty=format:"%s" ${{ github.ref_name }})
          other_commits=$(head -n 20 release.md | grep "^- " | grep -v "^- ${main_commit}$" | head -n 9)
          commits="• ${main_commit}"
          if [ -n "$other_commits" ]; then
            commits="${commits}"$'\n'"${other_commits}"
          fi
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> $GITHUB_OUTPUT

      - name: Send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_1: ${{ secrets.TELEGRAM_CHANNEL_ID_1 }}
          TELEGRAM_CHANNEL_ID_2: ${{ secrets.TELEGRAM_CHANNEL_ID_2 }}
          TELEGRAM_CHANNEL_ID_3: ${{ secrets.TELEGRAM_CHANNEL_ID_3 }}
          VERSION: ${{ github.ref_name }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          IS_STABLE: ${{ env.IS_STABLE }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
