name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: android,windows,linux). Empty = all"
        required: false
        default: ""
        type: string
      android_signing:
        description: "Android signing: 'auto' = use secrets if present, 'debug' = always debug-sign"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - debug
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve build matrix
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail

          # macOS is disabled: `flutter build macos --no-codesign` (setup.dart,
          # MACOS_CODESIGN=0) still fails on the runner without a signing
          # identity, and a signed build needs Apple Developer secrets that this
          # fork does not have. setup.dart keeps the --no-codesign plumbing, so
          # re-enabling macOS is just uncommenting these two entries.
          # Format: platform|os|arch   (arch may be empty)
          entries=(
            'android|ubuntu-latest|'
            'windows|windows-latest|amd64'
            'linux|ubuntu-24.04|amd64'
            'windows|windows-11-arm|arm64'
            'linux|ubuntu-24.04-arm|arm64'
          )

          req=()
          if [ -n "${REQUESTED//[[:space:]]/}" ]; then
            IFS=',' read -ra parts <<< "$REQUESTED"
            for p in "${parts[@]}"; do
              p="${p//[[:space:]]/}"
              if [ -n "$p" ]; then req+=("$p"); fi
            done
          fi

          out='['
          count=0
          matched=" "
          for e in "${entries[@]}"; do
            IFS='|' read -r platform os arch <<< "$e"

            if [ ${#req[@]} -gt 0 ]; then
              match=0
              for r in "${req[@]}"; do
                if [ "$r" = "$platform" ]; then match=1; break; fi
              done
              if [ "$match" -ne 1 ]; then continue; fi
            fi

            matched="$matched$platform "
            if [ "$count" -gt 0 ]; then out="$out,"; fi
            item="{\"platform\":\"$platform\",\"os\":\"$os\""
            if [ -n "$arch" ]; then item="$item,\"arch\":\"$arch\""; fi
            out="$out$item}"
            count=$((count + 1))
            echo "  - $platform${arch:+ $arch} on $os"
          done
          out="$out]"

          if [ "$count" -eq 0 ]; then
            echo "::error::No known platform matched '$REQUESTED'. Known: android,windows,linux"
            exit 1
          fi

          # Dropping a typo silently would mean shipping fewer platforms than
          # asked for, so say so out loud.
          unknown=""
          for r in "${req[@]}"; do
            case "$matched" in
              *" $r "*) ;;
              *) unknown="$unknown $r" ;;
            esac
          done
          if [ -n "$unknown" ]; then
            echo "::warning::Ignored unknown platform(s):$unknown. Known: android,windows,linux"
          fi

          if [ ${#req[@]} -eq 0 ]; then
            echo "Requested platforms: (none) -> building all"
          else
            echo "Requested platforms: $REQUESTED"
          fi
          echo "matrix=$out" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath
      
      - name: Setup Rust ARM64 target for cross-compilation
        if: matrix.platform == 'windows' && matrix.arch == 'arm64' && !startsWith(matrix.os, 'windows-11-arm')
        run: rustup target add aarch64-pc-windows-msvc

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FORCE_DEBUG: ${{ inputs.android_signing == 'debug' }}
        run: |
          set -euo pipefail

          # Release signing is optional. android/app/build.gradle.kts falls back to
          # signingConfigs "debug" when android/app/keystore.jks is absent, and AGP
          # generates that debug keystore itself, so a fork with no signing secrets
          # still produces installable release APKs. The important part is to never
          # create a *partial* keystore: a present-but-broken one flips isRelease to
          # true and Gradle then dies ~7min later with an opaque ASN.1 error
          # ("Tag number over 30 is not supported") inside :app:packageRelease.
          if [ "$FORCE_DEBUG" = "true" ]; then
            echo "::notice::android_signing=debug - release signing skipped, APKs will be debug-signed"
            exit 0
          fi

          missing=()
          for v in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done

          if [ ${#missing[@]} -eq 4 ]; then
            echo "::notice::No Android signing secrets configured - building debug-signed APKs."
            echo "::notice::They install fine, but cannot be published to Google Play and cannot update an already-installed build."
            exit 0
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Android signing secrets partially configured, missing: ${missing[*]}."
            echo "::error::Set all four (KEYSTORE, KEY_ALIAS, STORE_PASSWORD, KEY_PASSWORD) or remove all four. To build debug-signed instead, re-run with android_signing=debug."
            exit 1
          fi

          # ---- diagnostics ------------------------------------------------
          echo "KEYSTORE       : ${#KEYSTORE} chars"
          echo "KEY_ALIAS      : '$KEY_ALIAS' (${#KEY_ALIAS} chars)"
          echo "STORE_PASSWORD : ${#STORE_PASSWORD} chars"
          echo "KEY_PASSWORD   : ${#KEY_PASSWORD} chars"

          # tr -d strips CR/LF so a paste that picked up Windows line breaks still decodes.
          printf '%s' "$KEYSTORE" | tr -d '\r\n' | base64 --decode > android/app/keystore.jks
          size=$(stat -c%s android/app/keystore.jks)
          sum=$(sha256sum android/app/keystore.jks | cut -d' ' -f1)
          echo "decoded        : $size bytes"
          echo "decoded sha256 : $sum"

          if [ "$size" -lt 500 ]; then
            echo "::error::Decoded keystore is only $size bytes. KEYSTORE is not a usable base64 keystore (expected ~2.2KB / 2976 base64 chars)."
            echo "::error::To build debug-signed instead, re-run with android_signing=debug."
            exit 1
          fi

          # List without -alias so this step separates "wrong password"
          # (fails here) from "alias not found" (fails at the grep below).
          if ! out=$(keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" 2>&1); then
            echo "::error::Keystore decoded fine ($size bytes, sha256 $sum) but STORE_PASSWORD cannot open it."
            echo "$out" | head -4 | sed 's/^/  /'
            echo "::error::To build debug-signed instead, re-run with android_signing=debug."
            exit 1
          fi
          echo "store password : OK"
          echo "$out" | grep -iE 'PrivateKeyEntry|trustedCertEntry' | sed 's/^/  /' || true

          if ! echo "$out" | grep -q "$KEY_ALIAS"; then
            echo "::error::Alias '$KEY_ALIAS' is not present in the keystore. Entries listed above."
            echo "::error::To build debug-signed instead, re-run with android_signing=debug."
            exit 1
          fi

          if [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::warning::STORE_PASSWORD != KEY_PASSWORD; Gradle uses keyPassword for the key itself"
          fi

          echo "keyAlias=$KEY_ALIAS" >> android/local.properties
          echo "storePassword=$STORE_PASSWORD" >> android/local.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/local.properties
          echo "Android keystore validated: alias '$KEY_ALIAS', $size bytes, sha256 $sum"

      - name: Setup Firebase Config
        if: startsWith(matrix.platform,'android')
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    runs-on: ubuntu-latest
    needs: [build]
    # Only tag runs may rewrite CHANGELOG.md and push back to main.
    if: startsWith(github.ref, 'refs/tags/')
    # Required: the job's Commit step runs `git push`, and without this the
    # workflow inherits the repository default (read-only on this fork), so the
    # push fails with "refusing to allow a GitHub App to create or update
    # workflow" / 403. Only contents is needed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        if: ${{ env.IS_STABLE == 'true' }}
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          tags=($(git tag --merged $(git rev-parse HEAD) --sort=-creatordate))
          preTag=$(grep -oP '^## \K.*' CHANGELOG.md | head -n 1)
          currentTag=""
          for ((i = 0; i <= ${#tags[@]}; i++)); do
            if (( i < ${#tags[@]} )); then
              tag=${tags[$i]}
            else
              tag=""
            fi
            if [ -n "$currentTag" ]; then
              if [ "$(echo -e "$currentTag\n$preTag" | sort -V | head -n 1)" == "$currentTag" ]; then
                break
              fi
            fi
            if [ -n "$currentTag" ]; then
              echo "## $currentTag" >> NEW_CHANGELOG.md
              echo "" >> NEW_CHANGELOG.md
              if [ -n "$tag" ]; then
                git log --pretty=format:"%B" "$tag..$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              else
                git log --pretty=format:"%B" "$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> NEW_CHANGELOG.md
              fi
              echo "" >> NEW_CHANGELOG.md
            fi
            currentTag=$tag
          done
          cat CHANGELOG.md >> NEW_CHANGELOG.md
          cat NEW_CHANGELOG.md > CHANGELOG.md

      - name: Commit
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "flclashx@pluralplay.ru"
            git config --local user.name "pluralplay"
            git commit -m "Update changelog"
            git push
            if [ $? -eq 0 ]; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions: write-all
    needs: [build]
    if: always() && (needs.build.result == 'success') && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          tags=($(git tag --merged $(git rev-parse HEAD) --sort=-creatordate))
          
          # Determine previous tag based on release type
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            # For stable: get latest stable release from API
            preTag=$(curl --silent "https://api.github.com/repos/pluralplay/FlClashX/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")' || echo "")
          else
            # For pre-release: get the latest pre-release tag (last tag with '-' in name before current)
            preTag=""
            for tag in "${tags[@]}"; do
              if [ "$tag" != "${tags[0]}" ] && [[ "$tag" == *-* ]]; then
                preTag="$tag"
                break
              fi
            done
            # If no previous pre-release found, use latest stable
            if [ -z "$preTag" ]; then
              preTag=$(curl --silent "https://api.github.com/repos/pluralplay/FlClashX/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")' || echo "")
            fi
          fi
          
          currentTag=""
          for ((i = 0; i <= ${#tags[@]}; i++)); do
            if (( i < ${#tags[@]} )); then
              tag=${tags[$i]}
            else
              tag=""
            fi
            if [ -n "$currentTag" ]; then
              if [ "$(echo -e "$currentTag\n$preTag" | sort -V | head -n 1)" == "$currentTag" ]; then
                break
              fi
            fi
            if [ -n "$currentTag" ]; then
              if [ -n "$tag" ]; then
                git log --pretty=format:"%B" "$tag..$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> release.md
              else
                git log --pretty=format:"%B" "$currentTag" | awk 'NF {print "- " $0} !NF {print ""}' >> release.md
              fi
              echo "" >> release.md
            fi
            currentTag=$tag
          done

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          else
            sed "s|VERSION|$version|g" ./.github/pre_release_template.md >> release.md
          fi

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true

      - name: Upload release notes for notification
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release.md
          retention-days: 1

