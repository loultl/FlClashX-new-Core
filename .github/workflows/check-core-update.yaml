name: check-core-update

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Check a specific Prizrak-Core tag (for example v1.19.32-r4)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-core-update
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'loultl/FlClashX-new-Core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum

      - name: Select Prizrak-Core version
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TAG: ${{ inputs.force_tag }}
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -n 's|^replace github.com/metacubex/mihomo => github.com/legiz-ru/Prizrak-Core \([^ ]*\)$|\1|p' core/go.mod)
          test -n "$pinned" || { echo '::error::Missing Prizrak-Core module pin.'; exit 1; }
          if [[ -n "$FORCE_TAG" ]]; then
            target="$FORCE_TAG"
          else
            target=$(gh api --paginate repos/legiz-ru/Prizrak-Core/tags --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' | sort -V | tail -1)
            target="${target:-$pinned}"
          fi
          [[ "$target" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo '::error::Invalid Prizrak-Core version.'; exit 1; }
          echo "tag=$target" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/legiz-ru/Prizrak-Core/$target/go.mod" -o "$RUNNER_TEMP/prizrak-go.mod"

      - name: Sync engine and companion module pins
        env:
          TARGET: ${{ steps.target.outputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          from pathlib import Path
          upstream = Path(os.environ['RUNNER_TEMP'], 'prizrak-go.mod').read_text()
          replacements = {}
          in_block = False
          for source in upstream.splitlines():
              line = source.split('//', 1)[0].strip()
              if line == 'replace (':
                  in_block = True
                  continue
              if in_block and line == ')':
                  in_block = False
                  continue
              if line.startswith('replace '):
                  line = line[len('replace '):]
              elif not in_block:
                  continue
              if '=>' in line:
                  old, new = line.split('=>', 1)
                  replacements[old.strip().split()[0]] = new.strip().split()
          companions = ['github.com/metacubex/utls', 'github.com/metacubex/http', 'google.golang.org/protobuf']
          pins = {'github.com/metacubex/mihomo': ['github.com/legiz-ru/Prizrak-Core', os.environ['TARGET']]}
          for module in companions:
              subprocess.run(['go', 'mod', 'edit', '-dropreplace=' + module], cwd='core', check=True)
              if module in replacements:
                  pins[module] = replacements[module]
          for module, target in pins.items():
              if len(target) != 2:
                  raise SystemExit('Expected a versioned module replacement for ' + module)
              subprocess.run(['go', 'mod', 'edit', '-replace=' + module + '=' + '@'.join(target)], cwd='core', check=True)
          config = Path('build_config.yaml')
          config.write_text(re.sub(r'(?m)^core_version: .*$', 'core_version: ' + os.environ['TARGET'], config.read_text()))
          PYTHON
          git -C core/Clash.Meta fetch --depth=1 origin "$TARGET"
          git -C core/Clash.Meta checkout --detach FETCH_HEAD

      - name: Refresh module checksums and verify the wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go mod tidy
          go test .
          go vet . ./cmd/...

      - name: Open or refresh the update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: core-update/prizrak
          base: ${{ github.event.repository.default_branch }}
          commit-message: 'chore(core): sync Prizrak-Core to ${{ steps.target.outputs.tag }}'
          title: 'chore(core): sync Prizrak-Core to ${{ steps.target.outputs.tag }}'
          body: |
            Updates Prizrak-Core to `${{ steps.target.outputs.tag }}` and mirrors the companion replacements from that tag's `go.mod`.

            Includes the engine gitlink, `build_config.yaml`, and refreshed `core/go.mod` / `core/go.sum`. The Go wrapper tests and vet run before this pull request is created. Review and merge before tagging a release; this workflow does not publish builds.
          add-paths: |
            core/go.mod
            core/go.sum
            core/Clash.Meta
            build_config.yaml
